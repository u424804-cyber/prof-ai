let lang='ru',step=0,answers=Array(5).fill(null),pre=[3,3,3,3],post=[3,3,3,3],alias='',career='',source='',status=2,skills='',education='',nextstep='',conclusion='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),t=()=>T[lang];function track(){let count=[0,0,0,0];answers.forEach(a=>{if(a!==null)count[a]++});return count.indexOf(Math.max(...count))}function field(id,label,val,area=false){return `<label for="${id}">${label}</label>${area?`<textarea id="${id}">${esc(val)}</textarea>`:`<input id="${id}" value="${esc(val)}">`}`}function scale(arr){return `<p class="hint">${t().scale}</p>`+t().assess.map((q,i)=>`<div class="question"><label for="rate${i}">${q} — <b id="score${i}">${arr[i]}</b>/5</label><input style="width:100%" type="range" min="1" max="5" id="rate${i}" value="${arr[i]}" oninput="document.getElementById('score${i}').textContent=this.value;${step===0?'pre':'post'}[${i}]=Number(this.value)"></div>`).join('')}function report(){return `PROF-AI / ${t().finish}\n${alias}\n${t().direction}: ${t().tracks[track()]}\n${t().career}: ${career}\n${t().skills}: ${skills}\n${t().education}: ${education}\n${t().source}: ${source}\n${t().status}: ${t().statuses[status]}\n${t().nextstep}: ${nextstep}\n${t().conclusion}: ${conclusion}\n${t().before}: ${pre.join(', ')}\n${t().after}: ${post.join(', ')}`}function render(){let x=t();$('subtitle').textContent=x.sub;$('stage').textContent=x.stage.replace('{n}',step+1);$('privacy').textContent=x.privacy;$('bar').style.width=((step+1)/6*100)+'%';let h='';if(step===0)h=`<h2>${x.welcome}</h2><p>${x.intro}</p><div class="fields">${field('alias',x.alias,alias)}</div><h3>${x.pre}</h3>${scale(pre)}`;if(step===1)h=`<h2>${x.diagn}</h2><p class="hint">${x.diagnHelp}</p>`+x.qs.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>`+q.slice(1).map((a,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} onchange="answers[${i}]=${j};updateTrack()">${a}</label>`).join('')+'</div>').join('')+`<div class="question"><b>${x.result}:</b> <span id="trackResult">${answers.every(v=>v!==null)?x.tracks[track()]:'—'}</span></div>`;if(step===2)h=`<h2>${x.ai}</h2><p class="tag">${x.tracks[track()]}</p><p><b>${x.jobsTitle}:</b> ${x.jobs[track()]}</p><div class="fields">${field('career',x.career,career)}</div><p class="hint">${x.promptHelp}</p><div class="question" id="promptText"></div><button onclick="copyPrompt()">${x.copy}</button><p class="hint">${x.aiNote}</p>`;if(step===3)h=`<h2>${x.check}</h2><p>${x.checkHelp}</p><p><a target="_blank" rel="noopener noreferrer" href="https://www.enbek.kz">${x.enbek} ↗</a> &nbsp; <a target="_blank" rel="noopener noreferrer" href="https://www.gov.kz">${x.gov} ↗</a></p><div class="fields">${field('source',x.source,source,true)}</div><h3>${x.status}</h3>`+x.statuses.map((v,i)=>`<label class="choice"><input type="radio" name="status" value="${i}" ${status===i?'checked':''} onchange="status=${i}">${v}</label>`).join('');if(step===4)h=`<h2>${x.map}</h2><div class="fields">${field('skills',x.skills,skills,true)}${field('education',x.education,education,true)}${field('nextstep',x.nextstep,nextstep,true)}${field('conclusion',x.conclusion,conclusion,true)}</div>`;if(step===5){let avg=a=>(a.reduce((s,v)=>s+v,0)/4).toFixed(1);h=`<h2>🎓 ${x.finish}</h2><div class="question"><h3>${esc(career)}</h3><p><b>${x.direction}:</b> ${x.tracks[track()]}</p><p><b>${x.skills}:</b> ${esc(skills)||x.blank}</p><p><b>${x.education}:</b> ${esc(education)||x.blank}</p><p><b>${x.nextstep}:</b> ${esc(nextstep)||x.blank}</p><p><b>${x.status}:</b> ${x.statuses[status]}</p></div><h3>${x.post}</h3>${scale(post)}<div class="grid"><div class="metric">${x.before}<br><strong>${avg(pre)}/5</strong></div><div class="metric">${x.after}<br><strong id="afterAvg">${avg(post)}/5</strong></div></div><p class="hint">${x.note}</p><button onclick="copyText(report())">${x.copyMap}</button> <button class="secondary" onclick="window.print()">${x.print}</button>`}h+=`<div class="actions"><button class="secondary" ${step===0?'disabled':''} onclick="move(-1)">${x.back}</button><button onclick="${step===5?'restart()':'move(1)'}">${step===5?x.restart:x.next}</button></div>`;$('app').innerHTML=h;if(step===2){$('career').addEventListener('input',e=>{career=e.target.value;showPrompt()});showPrompt()}if(step===5){document.querySelectorAll('input[type=range]').forEach(a=>a.addEventListener('input',()=>{$('afterAvg').textContent=(post.reduce((s,v)=>s+v,0)/4).toFixed(1)+'/5'}))}}function showPrompt(){if($('promptText'))$('promptText').textContent=t().prompt.replace('{career}',career||'...').replace('{track}',t().tracks[track()])}function copyText(s){navigator.clipboard?.writeText(s).then(()=>alert(t().copied)).catch(()=>window.prompt(t().copy,s))}function copyPrompt(){copyText(t().prompt.replace('{career}',career||'...').replace('{track}',t().tracks[track()]))}function updateTrack(){if($('trackResult'))$('trackResult').textContent=answers.every(v=>v!==null)?t().tracks[track()]:'—'}function save(){if($('alias'))alias=$('alias').value;if($('career'))career=$('career').value;if($('source'))source=$('source').value;if($('skills'))skills=$('skills').value;if($('education'))education=$('education').value;if($('nextstep'))nextstep=$('nextstep').value;if($('conclusion'))conclusion=$('conclusion').value}function move(n){save();if(n>0&&step===1&&answers.some(v=>v===null))return alert(t().needAnswers);if(n>0&&step===2&&!career.trim())return alert(t().needCareer);step=Math.max(0,Math.min(5,step+n));render();window.scrollTo(0,0)}function restart(){step=0;answers=Array(5).fill(null);pre=[3,3,3,3];post=[3,3,3,3];alias=career=source=skills=education=nextstep=conclusion='';status=2;render()}$('lang').addEventListener('change',e=>{save();lang=e.target.value;document.documentElement.lang=lang;render()});render();</script><style>@media print{body{background:white}.hero,.actions,button,input[type=range],footer{display:none!important}.card{box-shadow:none}.wrap{padding:0}}</style></body></html>
